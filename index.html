<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>CampusFindr – Campus Lost &amp; Found Hub | SIH1516</title>
    <meta
      name="description"
      content="CampusFindr is a centralized institutional asset Lost &amp; Found Hub. Report lost items, find recovered assets, and help wardens resolve claims on campus. SIH1516."
    />
    <meta name="keywords" content="campus lost found, SIH1516, smart education, institutional automation, lost items" />
    <meta name="author" content="CampusFindr – SIH1516" />

    <!-- Open Graph -->
    <meta property="og:title" content="CampusFindr – Campus Lost &amp; Found Hub" />
    <meta property="og:description" content="Centralized institutional asset management for lost and found items." />
    <meta property="og:type" content="website" />

    <!-- No-FOUT theme detection — must run before paint -->
    <script>
      (function () {
        var stored = localStorage.getItem('cf_theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Google Fonts: DM Sans (body) + DM Serif Display (headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
